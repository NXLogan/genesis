# group.admin hérite de group.mod, qui hérite de group.support.
# Le staff du quotidien va dans group.mod. group.admin est réservé au propriétaire.
# ox_lib donne command.<nom> au groupe indiqué dans `restricted` de chaque commande.
# Ne pas remettre `add_ace group.admin command allow` : ça ouvre toutes les commandes, y compris givemoney.

# Resources
add_ace resource.gns_core command allow # gns_core exécute des commandes en son nom

# Ox_lib
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# Ace Groups
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow

# Inheritance
add_principal group.admin group.mod
add_principal group.mod group.support
